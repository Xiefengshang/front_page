<svg width="256" height="256" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
    <title>Validated AI Key Logo</title>
    <defs>
        <linearGradient id="shieldGradient" x1="0.5" y1="0" x2="0.5" y2="1">
            <stop offset="0%" stop-color="#4338CA" /> <!-- Indigo -->
            <stop offset="100%" stop-color="#3B82F6" /> <!-- Blue -->
        </linearGradient>
        <linearGradient id="keyGradient" x1="0.5" y1="0" x2="0.5" y2="1">
            <stop offset="0%" stop-color="#F3F4F6" /> <!-- Lighter Gray -->
            <stop offset="100%" stop-color="#D1D5DB" /> <!-- Darker Gray -->
        </linearGradient>
        <linearGradient id="checkGradientV2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#22C55E" /> <!-- Bright Green -->
            <stop offset="100%" stop-color="#16A34A" /> <!-- Darker Green -->
        </linearGradient>
    </defs>

    <!-- Shield Background -->
    <path fill="url(#shieldGradient)" stroke-width="1.5"
          d="M12 2.5L3.5 5.5v6c0 5.22 3.6 10.1 8.5 11.5 4.9-1.4 8.5-6.28 8.5-11.5v-6L12 2.5z" />

    <!-- Key shape where the head is a checkmark -->
    <g transform="translate(0, -1)">
        <!-- Key Shaft & Teeth -->
        <path fill="url(#keyGradient)" d="M11.25 10.5h1.5v9h-1.5z" />
        <path fill="url(#keyGradient)" d="M12.75 16.5h2v1.5h-2z" />
        <path fill="url(#keyGradient)" d="M12.75 13.5h3v1.5h-3z" />

        <!-- Checkmark shaped Key Head -->
        <path stroke="url(#checkGradientV2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
              d="M9.75 9.5l2 2 4-4" />

    </g>
</svg>